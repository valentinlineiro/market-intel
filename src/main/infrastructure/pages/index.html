<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Intel — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #020817; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
    h2 { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; color: #475569; text-transform: uppercase; margin-bottom: 16px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .stat { display: flex; flex-direction: column; gap: 4px; }
    .stat-value { font-size: 2rem; font-weight: 700; color: #f1f5f9; }
    .stat-label { font-size: 0.75rem; color: #64748b; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 8px 12px; color: #475569; font-weight: 600; border-bottom: 1px solid #1e293b; }
    td { padding: 10px 12px; border-bottom: 1px solid #0f172a; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; }
    .badge-watching { background: #1e3a5f; color: #60a5fa; }
    .badge-testing  { background: #1a3a2a; color: #34d399; }
    .badge-scaling  { background: #3b1f5e; color: #a78bfa; }
    .badge-killed   { background: #3b1f1f; color: #f87171; }
    .loading { color: #475569; font-size: 0.875rem; }
    .error   { color: #f87171; font-size: 0.875rem; }
  </style>
</head>
<body>
<div class="container">
  <!-- Auth token (stored in memory only, never persisted) -->
  <div id="auth-bar" style="margin-bottom:16px;display:flex;gap:8px;align-items:center;">
    <input id="secret-input" type="password" placeholder="Worker secret (para deployar)"
      style="flex:1;max-width:320px;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#f1f5f9;font-size:0.8rem;">
    <span id="auth-status" style="font-size:0.75rem;color:#475569;"></span>
  </div>

  <!-- Copy editor modal -->
  <div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;">
    <div style="background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px;width:min(600px,90vw);max-height:90vh;overflow-y:auto;">
      <h3 style="color:#f1f5f9;margin-bottom:20px;">Editar copy · <span id="modal-segment"></span></h3>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <label style="font-size:0.75rem;color:#64748b;">Headline</label>
        <input id="copy-title" type="text" style="padding:10px;background:#020817;border:1px solid #1e293b;border-radius:6px;color:#f1f5f9;font-size:0.9rem;width:100%;">
        <label style="font-size:0.75rem;color:#64748b;">Subtitle</label>
        <textarea id="copy-subtitle" rows="3" style="padding:10px;background:#020817;border:1px solid #1e293b;border-radius:6px;color:#f1f5f9;font-size:0.85rem;resize:vertical;width:100%;"></textarea>
        <label style="font-size:0.75rem;color:#64748b;">CTA</label>
        <input id="copy-cta" type="text" style="padding:10px;background:#020817;border:1px solid #1e293b;border-radius:6px;color:#f1f5f9;font-size:0.9rem;width:100%;">
      </div>
      <div id="modal-status" style="margin-top:12px;font-size:0.8rem;color:#64748b;min-height:1.2em;"></div>
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button id="modal-deploy" style="flex:1;padding:12px;background:#3b82f6;color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Deployar</button>
        <button onclick="closeModal()" style="padding:12px 20px;background:#1e293b;color:#94a3b8;border:none;border-radius:8px;cursor:pointer;">Cancelar</button>
      </div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;">
    <div>
      <div style="font-size:1.5rem;font-weight:700;color:#f1f5f9;">Market Intel</div>
      <div style="font-size:0.8rem;color:#475569;margin-top:2px;">Señales de dolor · Cádiz / España</div>
    </div>
    <div id="updated" style="font-size:0.75rem;color:#334155;"></div>
  </div>

  <h2>Resumen</h2>
  <div class="grid" style="margin-bottom:32px;" id="stats-grid">
    <div class="card"><p class="loading">Cargando...</p></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h2 style="margin:0;">Sectores Emergentes</h2>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="discovery-ts" style="font-size:0.7rem;color:#334155;"></span>
      <button id="run-discovery-btn"
        onclick="runDiscovery()"
        style="padding:6px 14px;background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:6px;font-size:0.75rem;cursor:pointer;">
        Descubrir ahora
      </button>
    </div>
  </div>
  <div id="sectors-grid" class="grid" style="margin-bottom:32px;">
    <div class="card"><p class="loading">Cargando...</p></div>
  </div>

  <h2>Oportunidades</h2>
  <div class="card" style="overflow-x:auto;">
    <table id="opps-table">
      <thead><tr><th>Segmento</th><th>Score</th><th>Estado</th><th>Señales</th><th>Resumen</th><th>Landing</th><th></th></tr></thead>
      <tbody id="opps-body"><tr><td colspan="7" class="loading">Cargando...</td></tr></tbody>
    </table>
  </div>

  <h2 style="margin-top:32px;">Leads</h2>
  <div class="card" style="overflow-x:auto;">
    <table id="leads-table">
      <thead><tr><th>Segmento</th><th>Email</th><th>Fecha</th></tr></thead>
      <tbody id="leads-body"><tr><td colspan="3" class="loading">Cargando...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  const WORKER = "https://market-intel-api.valentinlineiro.workers.dev";

  async function load() {
    try {
      const [statsRes, oppsRes, leadsRes, discoveryRes] = await Promise.all([
        fetch(`${WORKER}/public/stats`),
        fetch(`${WORKER}/public/opportunities`),
        fetch(`${WORKER}/public/leads`),
        fetch(`${WORKER}/public/discovery`),
      ]);
      const stats     = await statsRes.json();
      const opps      = await oppsRes.json();
      const leads     = await leadsRes.json();
      const discovery = await discoveryRes.json();

      document.getElementById("updated").textContent =
        "Actualizado: " + new Date().toISOString().slice(0,16).replace("T"," ") + " UTC";

      if (discovery.discovered_at) {
        const ago = Math.round((Date.now() - new Date(discovery.discovered_at)) / 60000);
        document.getElementById("discovery-ts").textContent =
          `Última exploración: hace ${ago < 60 ? ago + " min" : Math.round(ago / 60) + " h"}`;
      }

      const bySegHtml = Object.entries(stats.by_segment || {})
        .map(([seg, n]) => `<div class="stat"><span class="stat-value">${n}</span><span class="stat-label">${seg}</span></div>`)
        .join("");
      document.getElementById("stats-grid").innerHTML = `
        <div class="card"><div class="stat"><span class="stat-value">${stats.total_signals ?? 0}</span><span class="stat-label">Total señales</span></div></div>
        <div class="card"><div class="stat"><span class="stat-value">${stats.total_opportunities ?? 0}</span><span class="stat-label">Oportunidades</span></div></div>
        <div class="card">${bySegHtml}</div>
      `;

      const sectorCards = (discovery.candidates || []).slice(0, 6).map(c => {
        const scorePct   = Math.min(c.discovery_score / 20, 1);
        const scoreColor = scorePct > 0.6 ? "#34d399" : scorePct > 0.3 ? "#fbbf24" : "#94a3b8";
        const kwChips = (c.keywords || []).slice(0, 4).map(
          k => `<span style="padding:2px 6px;background:#1e293b;border-radius:4px;font-size:0.7rem;color:#64748b;">${k}</span>`
        ).join(" ");
        return `<div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
            <strong style="color:#f1f5f9;font-size:0.9rem;line-height:1.3;">${c.profile}</strong>
            <span style="color:${scoreColor};font-weight:700;font-size:0.85rem;white-space:nowrap;margin-left:8px;">${c.discovery_score.toFixed(1)}</span>
          </div>
          <p style="color:#64748b;font-size:0.8rem;margin-bottom:10px;line-height:1.4;">${c.pain}</p>
          <div style="display:flex;flex-wrap:wrap;gap:4px;">${kwChips}</div>
          <div style="margin-top:8px;font-size:0.7rem;color:#334155;">${c.post_count} posts · ${c.income_est || "—"}</div>
        </div>`;
      }).join("");

      document.getElementById("sectors-grid").innerHTML =
        sectorCards || '<div class="card"><p style="color:#475569;font-size:0.875rem;">Sin sectores detectados todavía. Haz clic en "Descubrir ahora".</p></div>';

      const rows = (opps.results || []).map(o => {
        const badge = `<span class="badge badge-${o.status}">${o.status}</span>`;
        const landing = o.landing_url
          ? `<a href="${o.landing_url}" style="color:#60a5fa;font-size:0.75rem;" target="_blank">ver</a>`
          : "—";
        const deployBtn = `<button onclick="openDeploy('${o.segment}')"
          style="padding:4px 10px;background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:6px;font-size:0.75rem;cursor:pointer;white-space:nowrap;">
          ${o.landing_url ? "Regenerar" : "Deploy"}
        </button>`;
        return `<tr>
          <td>${o.segment}</td>
          <td><strong>${(o.score||0).toFixed(1)}</strong>/10</td>
          <td>${badge}</td>
          <td>${o.signal_count ?? 0}</td>
          <td style="color:#94a3b8;font-size:0.8rem;">${(o.pain_summary||"").slice(0,60)}</td>
          <td>${landing}</td>
          <td>${deployBtn}</td>
        </tr>`;
      }).join("");
      document.getElementById("opps-body").innerHTML = rows || '<tr><td colspan="7" style="color:#475569;">Sin oportunidades todavía.</td></tr>';

      const allLeads = Object.entries(leads.by_segment || {}).flatMap(
        ([seg, entries]) => entries.map(e => ({ seg, ...e }))
      ).sort((a, b) => b.captured_at.localeCompare(a.captured_at));

      const leadRows = allLeads.map(l =>
        `<tr>
          <td>${l.seg}</td>
          <td style="font-family:monospace;font-size:0.8rem;">${l.email}</td>
          <td style="color:#64748b;font-size:0.8rem;">${l.captured_at.slice(0,16).replace("T"," ")}</td>
        </tr>`
      ).join("");
      document.getElementById("leads-body").innerHTML =
        leadRows || '<tr><td colspan="3" style="color:#475569;">Sin leads todavía.</td></tr>';

    } catch (e) {
      document.getElementById("stats-grid").innerHTML = `<div class="card"><p class="error">Error: ${e.message}</p></div>`;
    }
  }

  load();

  let currentSegment = null;
  let currentCopy    = null;

  async function openDeploy(segment) {
    const secret = document.getElementById("secret-input").value.trim();
    if (!secret) {
      alert("Introduce el Worker secret primero.");
      document.getElementById("secret-input").focus();
      return;
    }
    currentSegment = segment;
    currentCopy    = null;
    document.getElementById("modal-segment").textContent = segment;
    document.getElementById("modal-status").textContent  = "Generando copy con LLM...";
    document.getElementById("copy-title").value    = "";
    document.getElementById("copy-subtitle").value = "";
    document.getElementById("copy-cta").value      = "";
    document.getElementById("modal-overlay").style.display = "flex";

    try {
      const res = await fetch(`${WORKER}/synthesize`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${secret}`, "Content-Type": "application/json" },
        body: JSON.stringify({ segment }),
      });
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      const data = await res.json();
      currentCopy = data.copy;
      document.getElementById("copy-title").value    = currentCopy.title    || "";
      document.getElementById("copy-subtitle").value = currentCopy.subtitle || "";
      document.getElementById("copy-cta").value      = currentCopy.cta      || "";
      document.getElementById("modal-status").textContent = "Revisa y edita el copy antes de deployar.";
    } catch (e) {
      document.getElementById("modal-status").textContent = `Error: ${e.message}`;
    }
  }

  function closeModal() {
    document.getElementById("modal-overlay").style.display = "none";
    currentSegment = null;
    currentCopy    = null;
  }

  async function runDiscovery() {
    const secret = document.getElementById("secret-input").value.trim();
    if (!secret) {
      alert("Introduce el Worker secret primero.");
      document.getElementById("secret-input").focus();
      return;
    }
    const btn = document.getElementById("run-discovery-btn");
    btn.textContent = "Explorando...";
    btn.disabled = true;
    try {
      const res = await fetch(`${WORKER}/discover`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${secret}`, "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      const data = await res.json();
      btn.textContent = `✓ ${data.candidates?.length ?? 0} sectores encontrados`;
      setTimeout(() => { btn.textContent = "Descubrir ahora"; btn.disabled = false; load(); }, 2000);
    } catch (e) {
      btn.textContent = `Error: ${e.message}`;
      setTimeout(() => { btn.textContent = "Descubrir ahora"; btn.disabled = false; }, 3000);
    }
  }

  document.getElementById("modal-deploy").addEventListener("click", async () => {
    if (!currentSegment || !currentCopy) return;
    const secret = document.getElementById("secret-input").value.trim();
    const copy = {
      ...currentCopy,
      title:    document.getElementById("copy-title").value.trim(),
      subtitle: document.getElementById("copy-subtitle").value.trim(),
      cta:      document.getElementById("copy-cta").value.trim(),
    };
    document.getElementById("modal-status").textContent = "Deployando...";
    document.getElementById("modal-deploy").disabled = true;
    try {
      const res = await fetch(`${WORKER}/deploy`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${secret}`, "Content-Type": "application/json" },
        body: JSON.stringify({ segment: currentSegment, copy }),
      });
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      const { url } = await res.json();
      document.getElementById("modal-status").innerHTML =
        `✓ Deployado: <a href="${url}" target="_blank" style="color:#60a5fa;">${url}</a>`;
      setTimeout(() => { closeModal(); load(); }, 2500);
    } catch (e) {
      document.getElementById("modal-status").textContent = `Error: ${e.message}`;
    } finally {
      document.getElementById("modal-deploy").disabled = false;
    }
  });
</script>
</body>
</html>
