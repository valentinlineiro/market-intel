name: Setup Cloudflare

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      # ── 1. D1 ────────────────────────────────────────────────────────────
      - name: Create D1 database
        id: d1
        run: |
          # Crear D1 (si ya existe wrangler lo indica pero no falla)
          OUTPUT=$(wrangler d1 create market-intel 2>&1 || true)
          echo "$OUTPUT"

          # Extraer database_id del output o de la lista si ya existe
          DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id\s*=\s*"\K[^"]+' | head -1)

          if [ -z "$DB_ID" ]; then
            echo "D1 ya existe — obteniendo ID de la lista..."
            DB_ID=$(wrangler d1 list --json 2>/dev/null \
              | python3 -c "import sys,json; dbs=json.load(sys.stdin); \
                print(next(d['uuid'] for d in dbs if d['name']=='market-intel'))" \
              2>/dev/null || true)
          fi

          echo "DB_ID=$DB_ID" >> $GITHUB_OUTPUT
          echo "database_id = \"$DB_ID\""

      - name: Apply schema to D1
        run: |
          wrangler d1 execute market-intel --file=schema.sql --remote

      # ── 2. Worker ────────────────────────────────────────────────────────
      - name: Patch worker/wrangler.toml with DB_ID
        run: |
          DB_ID="${{ steps.d1.outputs.DB_ID }}"
          sed -i "s|database_id   = \"\"|database_id   = \"$DB_ID\"|" worker/wrangler.toml
          cat worker/wrangler.toml

      - name: Generate WORKER_SECRET
        id: secret
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "WORKER_SECRET=$SECRET" >> $GITHUB_OUTPUT
          # Enmascarar en logs
          echo "::add-mask::$SECRET"

      - name: Set Worker secret
        run: |
          echo "${{ steps.secret.outputs.WORKER_SECRET }}" \
            | wrangler secret put WORKER_SECRET \
              --name market-intel-api 2>&1

      - name: Deploy Worker
        id: worker
        run: |
          cd worker
          OUTPUT=$(wrangler deploy 2>&1)
          echo "$OUTPUT"
          WORKER_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+workers\.dev' | head -1)
          echo "WORKER_URL=$WORKER_URL" >> $GITHUB_OUTPUT

      # ── 3. Pages ─────────────────────────────────────────────────────────
      - name: Create Pages project
        run: |
          wrangler pages project create market-intel \
            --production-branch main 2>&1 || echo "Pages project ya existe"

      - name: First Pages deploy
        run: |
          mkdir -p dist/.keep
          echo "market-intel" > dist/.keep
          wrangler pages deploy dist \
            --project-name market-intel \
            --commit-dirty=true 2>&1

      # ── 4. Set Pages secrets (Telegram) ──────────────────────────────────
      - name: Set Pages secrets
        run: |
          # Telegram para la Pages Function (/signup)
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              | wrangler pages secret put TELEGRAM_TOKEN \
                --project-name market-intel
          fi
          if [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "${{ secrets.TELEGRAM_CHAT_ID }}" \
              | wrangler pages secret put TELEGRAM_CHAT_ID \
                --project-name market-intel
          fi

      # ── 5. Summary ───────────────────────────────────────────────────────
      - name: Print setup summary
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  SETUP COMPLETADO"
          echo "════════════════════════════════════════"
          echo ""
          echo "  D1 database_id : ${{ steps.d1.outputs.DB_ID }}"
          echo "  Worker URL     : ${{ steps.worker.outputs.WORKER_URL }}"
          echo "  Pages URL      : https://market-intel.pages.dev"
          echo ""
          echo "  ── Secrets a añadir en GitHub ───────"
          echo "  WORKER_URL     = ${{ steps.worker.outputs.WORKER_URL }}"
          echo "  WORKER_SECRET  = (ver paso 'Generate WORKER_SECRET' — está enmascarado)"
          echo "  CF_PAGES_PROJECT = market-intel"
          echo "  CF_PAGES_DOMAIN  = market-intel.pages.dev"
          echo ""
          echo "  ── Para ver WORKER_SECRET ────────────"
          echo "  Ve a Actions → este run → paso 'Generate WORKER_SECRET'"
          echo "  → Environment Variables → WORKER_SECRET"
          echo "════════════════════════════════════════"
