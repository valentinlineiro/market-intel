name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ── Detect what changed ───────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
      pages:  ${{ steps.diff.outputs.pages }}
      schema: ${{ steps.diff.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files: $CHANGED"

          echo "$CHANGED" | grep -q '^src/main/infrastructure/worker/' && echo "worker=true" >> $GITHUB_OUTPUT || echo "worker=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q '^src/main/infrastructure/pages/'  && echo "pages=true"  >> $GITHUB_OUTPUT || echo "pages=false"  >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q '^schema\.sql'                     && echo "schema=true" >> $GITHUB_OUTPUT || echo "schema=false" >> $GITHUB_OUTPUT

  # ── D1 schema migration ───────────────────────────────────────────────────
  migrate:
    needs: changes
    if: needs.changes.outputs.schema == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Apply schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:  ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:    d1 execute market-intel --file=schema.sql --remote --yes

  # ── Worker deploy ─────────────────────────────────────────────────────────
  deploy-worker:
    needs: [changes, migrate]
    if: |
      always() &&
      !failure() &&
      (needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://market-intel-api.valentinlineiro.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/main/infrastructure/worker
          command:          deploy

  # ── Pages deploy ──────────────────────────────────────────────────────────
  deploy-pages:
    needs: [changes, migrate]
    if: |
      always() &&
      !failure() &&
      (needs.changes.outputs.pages == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://market-intel.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:   pages deploy src/main/infrastructure/pages --project-name market-intel --commit-dirty=true
