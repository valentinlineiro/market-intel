name: Discover

on:
  schedule:
    - cron: "0 6 * * 3"   # Wednesdays only (was Wed + Sat)
  workflow_dispatch:
    inputs:
      limit:
        description: "Posts a recolectar"
        default: "100"
      min_score:
        description: "Score mínimo para alertar"
        default: "3.0"

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run discovery
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
from infrastructure.llm.chain import LLMChain
from infrastructure.notifications import TelegramNotifier
from application.discover import DiscoverUseCase
uc = DiscoverUseCase(LLMChain(), TelegramNotifier())
uc.run(
    limit=int('${{ github.event.inputs.limit || \"100\" }}'),
    min_score=float('${{ github.event.inputs.min_score || \"3.0\" }}'),
)
"
