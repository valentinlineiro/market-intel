name: Collect — Google News

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6h: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # ejecución manual desde GitHub UI

permissions:
  contents: write             # necesario para push a la rama data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Restaurar DB desde rama data
        run: |
          if git ls-remote --exit-code origin data; then
            git fetch origin data --depth=1
            git checkout FETCH_HEAD -- market_intel.db
            echo "DB restaurada ($(du -sh market_intel.db | cut -f1))"
          else
            echo "Rama data no existe todavía — se creará con DB vacía"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar collector Google News
        run: python collectors/gnews_collector.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Ejecutar scorer
        run: python scoring/scorer.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"

      - name: Guardar DB en rama data
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Guardar DB antes de cambiar de rama
          cp market_intel.db /tmp/market_intel.db

          # Ir a rama data (o crearla huérfana si no existe)
          if git ls-remote --exit-code origin data; then
            git fetch origin data --depth=1
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . > /dev/null 2>&1 || true
          fi

          cp /tmp/market_intel.db market_intel.db
          git add market_intel.db
          git diff --cached --quiet \
            && echo "Sin cambios en DB" \
            || git commit -m "chore: gnews collect $(date -u +'%Y-%m-%dT%H:%M') [skip ci]"
          git push origin HEAD:data
