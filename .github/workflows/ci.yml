name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  changes:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
      pages:  ${{ steps.diff.outputs.pages }}
      schema: ${{ steps.diff.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: diff
        run: |
          BASE="${{ github.event.before }}"
          # On first push or when before is unavailable, diff against parent
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files: $CHANGED"
          echo "$CHANGED" | grep -q '^src/main/infrastructure/worker/' && echo "worker=true" >> $GITHUB_OUTPUT || echo "worker=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q '^src/main/infrastructure/pages/'  && echo "pages=true"  >> $GITHUB_OUTPUT || echo "pages=false"  >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -qE '^src/main/infrastructure/worker/migrations/' && echo "schema=true" >> $GITHUB_OUTPUT || echo "schema=false" >> $GITHUB_OUTPUT

  migrate:
    needs: changes
    if: needs.changes.outputs.schema == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/main/infrastructure/worker
          command:          d1 migrations apply market-intel --remote

  deploy-worker:
    needs: [changes, migrate]
    if: |
      always() &&
      !failure() &&
      (needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://market-intel-api.valentinlineiro.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/main/infrastructure/worker
          command:          deploy

  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pages deps
        run: npm ci
        working-directory: src/main/infrastructure/pages

      - name: Build SvelteKit
        run: npm run build
        working-directory: src/main/infrastructure/pages

  deploy-pages:
    needs: [changes, migrate, build-pages]
    if: |
      always() &&
      !failure() &&
      (needs.changes.outputs.pages == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://market-intel.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Create Pages project (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:   pages project create market-intel --production-branch main
        continue-on-error: true

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion:  "4"
          workingDirectory: src/main/infrastructure/pages
          command:          pages deploy --project-name market-intel --commit-dirty=true
